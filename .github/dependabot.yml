# Every dependency stays on its latest stable release (see CLAUDE.md § Dependencies). Dependabot
# proposes each update weekly, one grouped PR per ecosystem, majors included.
version: 2
updates:
  # The pnpm workspace: every package under apps/, packages/, examples/ and docs/ (one lockfile).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    groups:
      npm:
        patterns: ["*"]

  # Kotlin Multiplatform storefront (Gradle, not pnpm), including the Gradle wrapper.
  - package-ecosystem: "gradle"
    directory: "/apps/storefront-cmp"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns: ["*"]

  # Actions used by this repository's own workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # The create-azphalt templates are standalone manifests (not in pnpm-workspace.yaml), so the root
  # entry never sees them. CLAUDE.md requires them to track the repository's versions.
  - package-ecosystem: "npm"
    directories:
      - "/packages/create-azphalt/templates/*"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    groups:
      templates:
        patterns: ["*"]
