# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/registry-sync.yml
# central-source-sha256: 447ae3e2386ebb45e5ab01f0b968d5cb4b0e07f2fe6f304d202c12bd622e52cb
# This file intentionally contains no repository secrets.
# central-run-tracker: HereLiesAz/workflows
name: Sync registry from extension repos
on:
  # Instant path: an extension repo posts a repository_dispatch after its own PR merges.
  #   curl -X POST -H "Authorization: Bearer $TOKEN" \
  #        -H "Accept: application/vnd.github+json" \
  #        https://api.github.com/repos/HereLiesAz/azphalt/dispatches \
  #        -d '{"event_type":"extension-updated"}'
  repository_dispatch:
    types: [extension-updated]
  # Catch-all: extensions that have not wired the dispatch still get picked up within the day, with
  # no per-repo setup at all. A no-op run costs one tarball fetch per pinned source and opens nothing.
  schedule:
    - cron: "17 6 * * *"
  # Adding an extension is a lockfile edit — its PR appends to sources.json and nothing else, so its
  # bytes do not exist under registry/packages until a sync builds them. Firing on that merge makes a
  # new extension publish itself instead of waiting for someone to remember to dispatch this by hand.
  #
  # This cannot recurse. A pinned run's own PR does not touch sources.json (only packages/ and
  # catalog.json), so merging it does not match this filter. A latest run's PR does re-pin
  # sources.json, so merging that one fires a pinned run — which finds the catalog already matches
  # the lockfile, produces no diff, and exits without opening anything. One idle run, not a loop.
  push:
    branches: [main]
    paths:
      - "apps/storefront/registry/sources.json"
      # A merged submission is built into the baked catalog by the same `build-catalog` run, so the
      # merge that accepts the source is what should go build its bytes. Without this a submission
      # sat on main until the nightly run noticed it — and, before submissions were folded in at all,
      # never reached the store.
      #
      # This does not recurse for the same reason the lockfile path does not: a sync's own PR touches
      # `registry/packages/` and `catalog.json`, never `submissions/`, so merging it matches nothing
      # here.
      - "submissions/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "pinned = publish sources at the shas already pinned; latest = also re-pin every source to its default-branch head"
        type: choice
        default: pinned
        options:
          - pinned
          - latest

permissions:
  actions: read
  contents: read
  statuses: read
jobs:
  central:
    name: Start
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      - id: locate
        name: Locate run
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: .github/workflows/registry-sync.yml
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: "set -euo pipefail\ncreated_at=\"$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\" --jq .created_at)\"\nthreshold=\"$(date -u -d \"$created_at - 5 seconds\" +%s)\"\n# The gateway skips some events a tracker still sees (unmatched filters, forks, manual\n# runs, CI-skip pushes). No central status within 20 minutes means no central run.\nfor _ in $(seq 1 80); do\n  url=\"$(gh api \"repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA?per_page=100\" --jq \\\n    \"[.[] | select(.context == \\\"$STATUS_CONTEXT\\\" and ((.updated_at | fromdateiso8601) >= $threshold))][0].target_url // empty\")\"\n  run_id=\"$(sed -nE 's#.*/HereLiesAz/workflows/actions/runs/([0-9]+).*#\\1#p' <<<\"$url\")\"\n  if [[ -n \"$run_id\" ]]; then\n    echo \"run_id=$run_id\" >> \"$GITHUB_OUTPUT\"\n    echo \"Run: $url\"\n    exit 0\n  fi\n  sleep 15\ndone\necho \"::notice::No run of this workflow was started for this event.\"\n"
  sync:
    name: sync
    needs:
      - central
    if: ${{ needs.central.outputs.run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: sync
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.central.outputs.run_id }}
          JOB_NAME: sync
        shell: bash
        run: "set -euo pipefail\napi=\"repos/HereLiesAz/workflows/actions/runs/$RUN_ID\"\nseen=\"\"\njob=\"\"\nfor _ in $(seq 1 1440); do\n  job=\"$(gh api \"$api/jobs?per_page=100\" --jq \"[.jobs[] | select(.name == \\\"$JOB_NAME\\\" or (.name | startswith(\\\"$JOB_NAME \\\")) or (.name | startswith(\\\"$JOB_NAME / \\\")))][0] // empty\")\"\n  if [[ -z \"$job\" ]]; then\n    [[ \"$(gh api \"$api\" --jq .status)\" == completed ]] && { echo \"Skipped.\"; exit 0; }\n    sleep 10\n    continue\n  fi\n  while IFS= read -r line; do\n    [[ -n \"$line\" ]] || continue\n    grep -qxF \"$line\" <<<\"$seen\" || { echo \"$line\"; seen+=\"$line\"$'\\n'; }\n  done < <(jq -r '.steps[]? | select(.status == \"completed\" and .conclusion != \"skipped\")\n    | \"\\(if .conclusion == \"success\" then \"✓\" else \"✗\" end) \\(.name)\"' <<<\"$job\")\n  [[ \"$(jq -r .status <<<\"$job\")\" == completed ]] && break\n  sleep 10\ndone\nconclusion=\"$(jq -r '.conclusion // \"cancelled\"' <<<\"$job\")\"\necho \"::group::Log\"\nif log=\"$(gh api \"repos/HereLiesAz/workflows/actions/jobs/$(jq -r .id <<<\"$job\")/logs\" 2>/dev/null)\"; then\n  sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' <<<\"$log\"\nelse\n  echo \"Log unavailable here: $(jq -r .html_url <<<\"$job\")\"\nfi\necho \"::endgroup::\"\ncase \"$conclusion\" in\n  success|skipped|neutral) exit 0 ;;\n  *) echo \"::error::$JOB_NAME: $conclusion\"; exit 1 ;;\nesac\n"
