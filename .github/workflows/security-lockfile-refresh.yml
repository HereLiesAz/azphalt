name: Security lockfile refresh

on:
  push:
    branches:
      - security/remediate-dependabot-2026-09
    paths:
      - package.json
      - apps/storefront/package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/remediate-dependabot-2026-09

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: refresh lockfile for security upgrades"
          git push
