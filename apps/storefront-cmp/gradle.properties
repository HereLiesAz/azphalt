kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Compose for Web runs on Kotlin/Wasm now; the old experimental js-canvas flag is gone.

# AGP 9 refuses to sit alongside kotlin("multiplatform") with its new DSL and built-in Kotlin support
# enabled, and points at `com.android.kotlin.multiplatform.library` instead — which produces a library,
# not the installable app this module has to be. These two properties are AGP's own documented opt-out
# and keep the classic behaviour, so one module can go on producing the desktop, wasm and Android
# builds from the same commonMain rather than being split apart to satisfy a plugin default.
android.builtInKotlin=false
android.newDsl=false
