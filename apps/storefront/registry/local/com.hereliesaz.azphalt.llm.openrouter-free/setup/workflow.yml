# Runner for com.hereliesaz.azphalt.llm.openrouter-free (azphalt kind:"llm", spec/llm.md § github-actions-runner).
# Committed by the host to the private sandbox repository; permissions equal llm.run.permissions.
# Generated by apps/storefront/scripts/gen-llm-packages.ts.
name: azphalt-llm com.hereliesaz.azphalt.llm.openrouter-free
run-name: ${{ fromJSON(inputs.task).correlationId }}
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task JSON (spec/llm.md § github-actions-runner)
        required: true
        type: string
permissions:
  contents: read
  checks: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        run: bash llm/com.hereliesaz.azphalt.llm.openrouter-free/setup/setup.sh
      - if: always()
        run: python3 llm/com.hereliesaz.azphalt.llm.openrouter-free/setup/run.py
        env:
          TASK: ${{ inputs.task }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER_KEY: ${{ secrets.PROVIDER_KEY }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azphalt-llm-result
          path: result.json
          if-no-files-found: error
          retention-days: 1
