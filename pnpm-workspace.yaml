packages:
  - "apps/*"
  # storefront-cmp is a Gradle/Kotlin-Wasm project, not a pnpm package. Its package.json exists only
  # to pin the package manager for Kotlin's Yarn tooling; keep it out of the pnpm workspace so it
  # never lands in pnpm-lock.yaml (which would break `pnpm install --frozen-lockfile` in CI).
  - "!apps/storefront-cmp"
  - "packages/*"
  - "packages/importers/*"
  - "packages/create-azphalt"
  - "docs"
  - "examples/*"

# pnpm 10+ blocks dependency install scripts unless listed here. esbuild's postinstall only
# selects its native binary.
allowBuilds:
  esbuild: true

# Security floors for transitive dependencies. pnpm 11+ reads settings only from this file,
# not from package.json's "pnpm" field.
overrides:
  "vite@<=6.4.2": "^6.4.3"
  "esbuild@<=0.24.2": ">=0.25.0"
  "postcss@<8.5.23": ">=8.5.23"
  "fast-uri@<3.1.7": "^3.1.7"
  "sharp@<0.35.4": ">=0.35.4"
  "@hono/node-server@<2.0.5": "^2.0.5"
  "hono@<4.13.5": ">=4.13.5"
  "undici@<6.28.0": "^6.28.0"
  "ip-address@<10.3.1": ">=10.3.1"
  "nanoid@<3.3.17": "^3.3.17"
  "js-yaml@<3.15.2": "^3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "browserslist@<=4.28.6": "^4.28.7"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0"
  "qs@<=6.15.3": ">=6.16.0"
